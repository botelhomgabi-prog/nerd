<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matrix Heart // NERD_LOOP</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at center, #001404 0%, #000000 85%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
      padding: 8px;
      user-select: none;
    }

    .hud-wrapper {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      max-width: 100%;
    }

    .terminal-box {
      border: 2px solid #008f11;
      box-shadow: 0 0 18px rgba(0, 255, 65, 0.25), inset 0 0 18px rgba(0, 143, 17, 0.15);
      background: rgba(0, 6, 2, 0.94);
      border-radius: 4px;
      overflow: hidden;
    }

    .terminal-header {
      padding: 8px 12px;
      border-bottom: 1px solid #008f11;
      font-size: clamp(10px, 2vw, 15px);
      font-weight: bold;
      letter-spacing: 1px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .txt-borda {
      color: #a8ffbe;
      text-shadow: 0 0 10px rgba(0, 255, 65, 0.9);
    }

    .txt-verde {
      color: #00ff41;
      text-shadow: 0 0 8px rgba(0, 255, 65, 0.7);
    }

    .txt-escuro {
      color: #008f11;
      text-shadow: 0 0 4px rgba(0, 143, 17, 0.5);
    }

    .txt-dim {
      color: #0d2b12;
    }

    pre#tela {
      margin: 0;
      padding: 10px;
      font-size: clamp(6.2px, 1.48vw, 15px);
      line-height: 1.18;
      letter-spacing: 1px;
      font-weight: bold;
      white-space: pre;
      text-align: center;
    }

    .status-bar {
      margin-top: 8px;
      font-size: clamp(10px, 1.5vw, 13px);
      color: #006614;
      letter-spacing: 0.5px;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>
  <main class="hud-wrapper">
    <div class="terminal-box">
      <header class="terminal-header">
        <span><span class="txt-escuro">MATRIX_CORE // MODE:</span> <span class="txt-verde">NERD_LOOP</span></span>
        <span class="txt-borda">[STATIC_FLOW]</span>
      </header>
      <pre id="tela" aria-label="Coração Matrix parado com a palavra nerd em movimento contínuo"></pre>
    </div>
    <footer class="status-bar" id="status">
      <span>[MATRIX_TERMINAL]</span>
      <span>Fluxo: 000 | Espaço: 3 cols</span>
    </footer>
  </main>

  <script>
    const telaEl = document.getElementById("tela");
    const statusEl = document.getElementById("status");

    const PALAVRA = "nerd";
    const ESPACO = "   "; // Espaçamento de 3 colunas entre as palavras
    const SEQUENCIA = PALAVRA + ESPACO;
    const TAM_SEQ = SEQUENCIA.length;

    const LARGURA = 74;
    const ALTURA = 30;
    const MEIA_LARGURA = LARGURA / 2.0;
    const MEIA_ALTURA = ALTURA / 2.0;
    const ESCALA_X = LARGURA * 0.22;
    const ESCALA_Y = ALTURA * 0.36;

    let passoFluxo = 0;
    let ultimoFrame = 0;
    const INTERVALO_MS = 85;

    function dentroDoCoracao(nx, ny) {
      const px = nx * nx;
      const py = ny * ny;
      const termo = px + py - 1.0;
      return (termo * termo * termo) - (px * ny * ny * ny) <= 0.0;
    }

    function coordX(col) {
      return (col - MEIA_LARGURA) / ESCALA_X;
    }

    function coordY(lin) {
      return (MEIA_ALTURA - lin) / ESCALA_Y;
    }

    // Pré-calcula a forma fixa do coração (como ele fica parado, não precisa recalcular a cada quadro)
    const mapaCoracao = Array.from({ length: ALTURA }, (_, lin) =>
      Array.from({ length: LARGURA }, (_, col) => dentroDoCoracao(coordX(col), coordY(lin)))
    );

    const mapaBorda = Array.from({ length: ALTURA }, (_, lin) =>
      Array.from({ length: LARGURA }, (_, col) => {
        if (!mapaCoracao[lin][col]) return false;
        const esq = col > 0 && !mapaCoracao[lin][col - 1];
        const dir = col < LARGURA - 1 && !mapaCoracao[lin][col + 1];
        const cima = lin > 0 && !mapaCoracao[lin - 1][col];
        const baixo = lin < ALTURA - 1 && !mapaCoracao[lin + 1][col];
        return esq || dir || cima || baixo;
      })
    );

    function renderizar(tempoAtual) {
      requestAnimationFrame(renderizar);

      if (tempoAtual - ultimoFrame < INTERVALO_MS) return;
      ultimoFrame = tempoAtual;

      const linhasHtml = new Array(ALTURA);

      for (let lin = 0; lin < ALTURA; lin++) {
        // Desloca a palavra "nerd" continuamente através do coração parado
        const deslocamento = passoFluxo + Math.floor(lin * 1.5);

        let linhaStr = "";
        let classeAtual = "";

        for (let col = 0; col < LARGURA; col++) {
          let char = " ";
          let classe = "";

          if (mapaCoracao[lin][col]) {
            const idxSeq = (((col + deslocamento) % TAM_SEQ) + TAM_SEQ) % TAM_SEQ;
            char = SEQUENCIA[idxSeq];

            if (mapaBorda[lin][col]) {
              classe = "txt-borda";
            } else if ((lin + col + passoFluxo) % 7 === 0) {
              classe = "txt-escuro";
            } else {
              classe = "txt-verde";
            }
          } else if (lin % 6 === 0 && col % 12 === 0) {
            char = "·";
            classe = "txt-dim";
          }

          if (classe !== classeAtual) {
            if (classeAtual !== "") linhaStr += "</span>";
            if (classe !== "") linhaStr += `<span class="${classe}">`;
            classeAtual = classe;
          }

          linhaStr += char;
        }

        if (classeAtual !== "") linhaStr += "</span>";
        linhasHtml[lin] = linhaStr;
      }

      telaEl.innerHTML = linhasHtml.join("\n");

      const contador = String(passoFluxo % 1000).padStart(3, "0");
      statusEl.lastElementChild.textContent = `Fluxo: ${contador} | Espaço: ${ESPACO.length} cols`;

      passoFluxo += 1;
    }

    requestAnimationFrame(renderizar);
  </script>
</body>
</html>
