<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coração Matrix Nerd</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #000;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Courier New', Courier, monospace;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1;
    }

    .cena {
      position: relative;
      z-index: 2;
      perspective: 900px;
    }

    pre {
      margin: 0;
      color: #00ff41;
      font-size: clamp(12px, 2.5vw, 22px);
      letter-spacing: 3px;
      line-height: 1.25;
      font-weight: bold;
      text-shadow: 0 0 8px #00ff41, 0 0 18px #008f11;
      user-select: none;
      animation: girar 6s linear infinite;
      transform-style: preserve-3d;
    }

    @keyframes girar {
      0% { transform: rotateY(0deg); }
      100% { transform: rotateY(360deg); }
    }
  </style>
</head>
<body>
  <canvas id="matrix"></canvas>
  
  <main class="cena">
    <pre id="coracao" aria-label="Coração formado pela palavra nerd"></pre>
  </main>

  <script>
    // 1. Animação do Coração em Loop
    const elementoCoracao = document.getElementById("coracao");
    const palavra = "nerd ";
    let offset = 0;

    function animarCoracao() {
      let indice = offset;
      let resultado = [];

      for (let y = 11; y > -11; y--) {
        let linha = "";
        for (let x = -22; x < 22; x++) {
          const xNorm = x * 0.068;
          const yNorm = y * 0.135;
          const formula = Math.pow(Math.pow(xNorm, 2) + Math.pow(yNorm, 2) - 1, 3) 
                        - Math.pow(xNorm, 2) * Math.pow(yNorm, 3);
          
          if (formula <= 0) {
            linha += palavra[indice % palavra.length];
            indice++;
          } else {
            linha += " ";
          }
        }
        resultado.push(linha);
      }

      elementoCoracao.textContent = resultado.join("\n");
      offset = (offset + 1) % palavra.length;
    }

    setInterval(animarCoracao, 180);
    animarCoracao();

    // 2. Efeito de chuva Matrix no fundo
    const canvas = document.getElementById("matrix");
    const ctx = canvas.getContext("2d");
    const letras = "NERD010101";
    const tamanhoFonte = 16;
    let gotas = [];

    function ajustarCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const colunas = Math.floor(canvas.width / tamanhoFonte);
      gotas = Array(colunas).fill(1);
    }

    ajustarCanvas();
    window.addEventListener("resize", ajustarCanvas);

    function desenharMatrix() {
      ctx.fillStyle = "rgba(0, 0, 0, 0.07)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#003b00";
      ctx.font = `${tamanhoFonte}px monospace`;

      for (let i = 0; i < gotas.length; i++) {
        const texto = letras[Math.floor(Math.random() * letras.length)];
        ctx.fillText(texto, i * tamanhoFonte, gotas[i] * tamanhoFonte);

        if (gotas[i] * tamanhoFonte > canvas.height && Math.random() > 0.975) {
          gotas[i] = 0;
        }
        gotas[i]++;
      }
    }

    setInterval(desenharMatrix, 45);
  </script>
</body>
</html>
