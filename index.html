<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cybernetic Heart // NERD_LOOP</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at center, #090314 0%, #000000 85%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
      padding: 8px;
      user-select: none;
    }

    .hud-wrapper {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      max-width: 100%;
    }

    .terminal-box {
      border: 2px solid #8a2be2;
      box-shadow: 0 0 18px rgba(138, 43, 226, 0.35), inset 0 0 18px rgba(138, 43, 226, 0.15);
      background: rgba(4, 2, 10, 0.94);
      border-radius: 4px;
      overflow: hidden;
    }

    .terminal-header {
      padding: 8px 12px;
      border-bottom: 1px solid #8a2be2;
      font-size: clamp(10px, 2vw, 15px);
      font-weight: bold;
      letter-spacing: 1px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .txt-ciano {
      color: #00ffff;
      text-shadow: 0 0 8px rgba(0, 255, 255, 0.7);
    }

    .txt-verde {
      color: #00ff41;
      text-shadow: 0 0 8px rgba(0, 255, 65, 0.75);
    }

    .txt-magenta {
      color: #ff00cc;
      text-shadow: 0 0 8px rgba(255, 0, 204, 0.75);
    }

    .txt-dim {
      color: #3a3a4a;
    }

    pre#tela {
      margin: 0;
      padding: 10px;
      font-size: clamp(6.2px, 1.48vw, 15px);
      line-height: 1.18;
      letter-spacing: 1px;
      font-weight: bold;
      white-space: pre;
      text-align: center;
    }

    .status-bar {
      margin-top: 8px;
      font-size: clamp(10px, 1.5vw, 13px);
      color: #6b6b80;
      letter-spacing: 0.5px;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>
  <main class="hud-wrapper">
    <div class="terminal-box">
      <header class="terminal-header">
        <span><span class="txt-ciano">CYBERNETIC HEART // MODE:</span> <span class="txt-verde">NERD_LOOP</span></span>
        <span class="txt-magenta">[ONLINE]</span>
      </header>
      <pre id="tela" aria-label="Coração cyberpunk formado pela palavra nerd"></pre>
    </div>
    <footer class="status-bar" id="status">
      <span>[CYBER_TERMINAL]</span>
      <span>Rotação: 000° | Espaço: 3 cols</span>
    </footer>
  </main>

  <script>
    const telaEl = document.getElementById("tela");
    const statusEl = document.getElementById("status");

    const PALAVRA = "nerd";
    const ESPACO = "   "; // Espaçamento de 3 colunas entre as palavras
    const SEQUENCIA = PALAVRA + ESPACO;
    const TAM_SEQ = SEQUENCIA.length;

    const LARGURA = 74;
    const ALTURA = 30;
    const MEIA_LARGURA = LARGURA / 2.0;
    const MEIA_ALTURA = ALTURA / 2.0;
    const ESCALA_X = LARGURA * 0.22;
    const ESCALA_Y = ALTURA * 0.36;

    let angulo = 0.0;
    let pulso = 0.0;
    let ultimoFrame = 0;
    const INTERVALO_MS = 80; // Mesmo tempo (0.08s) do código Python

    function dentroDoCoracao(nx, ny) {
      const px = nx * nx;
      const py = ny * ny;
      const termo = px + py - 1.0;
      return (termo * termo * termo) - (px * ny * ny * ny) <= 0.0;
    }

    function coordX(col, escalaPulso, fator3D) {
      return ((col - MEIA_LARGURA) / ESCALA_X) / (escalaPulso * fator3D);
    }

    function coordY(lin, escalaPulso) {
      return ((MEIA_ALTURA - lin) / ESCALA_Y) / escalaPulso;
    }

    function renderizar(tempoAtual) {
      requestAnimationFrame(renderizar);

      if (tempoAtual - ultimoFrame < INTERVALO_MS) return;
      ultimoFrame = tempoAtual;

      const cosA = Math.cos(angulo);
      const fator3D = Math.abs(cosA) > 0.28 ? cosA : (cosA >= 0 ? 0.28 : -0.28);
      const escalaPulso = 1.0 + 0.05 * Math.sin(pulso);

      const linhasHtml = new Array(ALTURA);

      for (let lin = 0; lin < ALTURA; lin++) {
        const ny = coordY(lin, escalaPulso);
        const nyCima = lin > 0 ? coordY(lin - 1, escalaPulso) : null;
        const nyBaixo = lin < ALTURA - 1 ? coordY(lin + 1, escalaPulso) : null;
        const deslocamento = Math.floor((angulo * 6) + (lin * 1.5));

        let linhaStr = "";
        let classeAtual = "";

        for (let col = 0; col < LARGURA; col++) {
          const nx = coordX(col, escalaPulso, fator3D);
          let char = " ";
          let classe = "";

          if (dentroDoCoracao(nx, ny)) {
            const bordaEsq = col > 0 && !dentroDoCoracao(coordX(col - 1, escalaPulso, fator3D), ny);
            const bordaDir = col < LARGURA - 1 && !dentroDoCoracao(coordX(col + 1, escalaPulso, fator3D), ny);
            const bordaCima = nyCima !== null && !dentroDoCoracao(nx, nyCima);
            const bordaBaixo = nyBaixo !== null && !dentroDoCoracao(nx, nyBaixo);

            const idxSeq = (((col + deslocamento) % TAM_SEQ) + TAM_SEQ) % TAM_SEQ;
            char = SEQUENCIA[idxSeq];

            if (bordaEsq || bordaDir || bordaCima || bordaBaixo) {
              classe = "txt-ciano";
            } else if ((lin + col) % 7 === 0) {
              classe = "txt-magenta";
            } else {
              classe = "txt-verde";
            }
          } else if (lin % 6 === 0 && col % 12 === 0) {
            char = "·";
            classe = "txt-dim";
          }

          if (classe !== classeAtual) {
            if (classeAtual !== "") linhaStr += "</span>";
            if (classe !== "") linhaStr += `<span class="${classe}">`;
            classeAtual = classe;
          }

          linhaStr += char;
        }

        if (classeAtual !== "") linhaStr += "</span>";
        linhasHtml[lin] = linhaStr;
      }

      telaEl.innerHTML = linhasHtml.join("\n");

      const graus = String(Math.floor((angulo * 180 / Math.PI) % 360)).padStart(3, "0");
      statusEl.lastElementChild.textContent = `Rotação: ${graus}° | Espaço: ${ESPACO.length} cols`;

      angulo += 0.10;
      pulso += 0.18;
    }

    requestAnimationFrame(renderizar);
  </script>
</body>
</html>
