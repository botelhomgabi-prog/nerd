<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coração Matrix Nerd</title>
  <style>
    body {
      margin: 0;
      background: #000;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Courier New', monospace;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1;
    }

    .cena {
      position: relative;
      z-index: 2;
      perspective: 900px;
    }

    pre {
      color: #00ff41;
      /* Aumenta o tamanho da letra e o espaçamento */
      font-size: clamp(12px, 2.5vw, 22px);
      letter-spacing: 3px;
      line-height: 1.25;
      font-weight: bold;
      text-shadow: 0 0 8px #00ff41, 0 0 18px #008f11;
      user-select: none;
      animation: girar 6s linear infinite;
      transform-style: preserve-3d;
    }

    @keyframes girar {
      0% { transform: rotateY(0deg); }
      100% { transform: rotateY(360deg); }
    }
  </style>
</head>
<body>
  <canvas id="matrix"></canvas>
  <div class="cena">
    <pre id="coracao"></pre>
  </div>

  <script>
    // Desenha o coração com "nerd" em loop contínuo
    const palavra = "nerd "; // O espaço extra separa as palavras
    let offset = 0;

    function animarCoracao() {
      let indice = offset;
      let resultado = [];

      // Grade reduzida (de 11 a -11 e -22 a 22) para o coração caber na tela com letras maiores
      for (let y = 11; y > -11; y--) {
        let linha = "";
        for (let x = -22; x < 22; x++) {
          let formula = Math.pow(Math.pow(x * 0.068, 2) + Math.pow(y * 0.135, 2) - 1, 3) 
                      - Math.pow(x * 0.068, 2) * Math.pow(y * 0.135, 3);
          
          if (formula <= 0) {
            linha += palavra[indice % palavra.length];
            indice++;
          } else {
            linha += " ";
          }
        }
        resultado.push(linha);
      }

      document.getElementById("coracao").textContent = resultado.join("\n");
      
      // Faz a palavra "andar" dentro do coração em loop
      offset = (offset + 1) % palavra.length;
    }

    // Atualiza o texto a cada 180ms para criar o loop de movimento
    setInterval(animarCoracao, 180);
    animarCoracao();

    // Efeito de chuva Matrix no fundo
    const canvas = document.getElementById("matrix");
    const ctx = canvas.getContext("2d");

    function ajustarCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    ajustarCanvas();
    window.addEventListener("resize", ajustarCanvas);

    const letras = "NERD010101";
    const tamanhoFonte = 16;
    const colunas = Math.floor(canvas.width / tamanhoFonte);
    const gotas = Array(colunas).fill(1);

    function desenharMatrix() {
      ctx.fillStyle = "rgba(0, 0, 0, 0.07)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#003b00";
      ctx.font = tamanhoFonte + "px monospace";

      for (let i = 0; i < gotas.length; i++) {
        const texto = letras[Math.floor(Math.random() * letras.length)];
        ctx.fillText(texto, i * tamanhoFonte, gotas[i] * tamanhoFonte);

        if (gotas[i] * tamanhoFonte > canvas.height && Math.random() > 0.975) {
          gotas[i] = 0;
        }
        gotas[i]++;
      }
    }

    setInterval(desenharMatrix, 45);
  </script>
</body>
</html>
